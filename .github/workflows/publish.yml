name: Publish images

# Builds the Docker image for linux/amd64 + linux/arm64 on native GitHub
# runners in parallel, then merges them into a single multi-arch manifest
# pushed to GHCR.
#
# Triggers:
#   - push to main           -> :latest, :main-<shortsha>
#   - git tag matching v*    -> :X.Y.Z, :X.Y, :latest (a pre-release tag, v0.2.0-rc.1: :0.2.0-rc.1 only),
#                               and the release binary for Linux arm64 boards (release-* jobs)
#   - repository_dispatch    -> same as a push to main (main-merged, sent after a Dependabot merge)
#   - workflow_dispatch      -> :<input.tag> only (default: dev), never :latest
#     the names above (latest, main-*, versions) and buildcache-* are refused
#
# Dependabot merges made by the auto-merge workflow fire no push event, so that
# workflow sends main-merged once the PR is in; its ref is main, like a push.
#
# First-time setup: after the first run, go to GitHub -> your profile ->
# Packages -> monero-miner-setup -> Package settings -> Change visibility
# to Public. Otherwise docker pull requires a GHCR token.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  repository_dispatch:
    types: [main-merged]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to publish (e.g. dev, nightly). Only alphanumerics, dot, dash, underscore; not latest, main-*, buildcache-* or a version.
        required: false
        default: dev

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME is set per job from ${GITHUB_REPOSITORY,,} because OCI
  # references must be lowercase and github.repository preserves the repo's
  # canonical case (e.g. MorganKryze/Monero-miner-setup).

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.ref }}
  # Safe to cancel: same ref getting a newer push means the older build is
  # stale and its output would be overwritten anyway. Manual runs get their
  # own group: they don't publish :latest, so one must never cancel a push.
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    steps:
      - name: Set lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push per-arch digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Two cache sources in fallback order: GHA cache (fast, evicted
          # after ~7 days idle) then a registry cache tag in our own GHCR
          # package (durable, no eviction). Both get written on completion.
          cache-from: |
            type=gha,scope=publish-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=publish-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Set lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate dispatch input (allowed characters, no reserved name)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # Match the whole string: grep tests line by line, so a newline in the
          # input would add its own rule to the tags list. The value is not echoed
          # back, since a line of it could read as a workflow command.
          if ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid tag input: only alphanumerics, dot, dash, underscore"
            exit 1
          fi
          # The push and release rules own these names; a manual run must not move them.
          case "$INPUT_TAG" in
            latest|main-*|buildcache-*|v[0-9]*|[0-9]*)
              echo "::error::Reserved tag name: $INPUT_TAG"
              exit 1
              ;;
          esac

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only the two explicit latest rules below may add :latest; the default
          # flavor would also add it for any semver tag, whatever the event.
          flavor: latest=false
          tags: |
            # Main branch pushes: always-current :latest + a SHA-pinned :main-<sha>.
            # Push only: the default-branch flag is also true for a manual dispatch on main.
            type=raw,value=latest,enable=${{ (github.event_name == 'push' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ (github.event_name == 'push' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/main' }}
            # Version tag pushes: :X.Y.Z, :X.Y, and update :latest. A pre-release tag (a - after the
            # version, v0.2.0-rc.1) publishes :0.2.0-rc.1 alone.
            # Push only: a manual run on a tag ref would republish that release and move :latest.
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && !contains(github.ref, '-') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            # Manual dispatch: user-supplied tag.
            type=raw,value=${{ env.DISPATCH_TAG }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_REF}@sha256:%s " *)

      - name: Inspect published image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE_REF}:${IMAGE_VERSION}"

  # A v* tag also publishes the miner for Linux arm64 boards (scripts/install.sh --prebuilt). This
  # job compiles XMRig, upstream code run through its own CMake scripts, so it holds no write or
  # signing token: the job below publishes what it built.
  release-build:
    name: Build release binary (linux/arm64)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      xmrig-commit: ${{ steps.source.outputs.commit }}
    steps:
      # git first: without it in the container, actions/checkout fetches no submodule.
      - name: Install build packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake libuv1-dev libssl-dev libhwloc-dev

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      # The checkout belongs to the runner's user, not the container's root: git must be told the
      # folder is safe.
      - name: Read the pinned XMRig commit
        id: source
        run: echo "commit=$(git -c safe.directory='*' -C dependencies/xmrig rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Unmodified, from the commit the tag pins, as docker/Dockerfile builds it: libuv from the
      # shared library, so the board loads its packaged libuv1t64 and gets its updates.
      - name: Build XMRig
        run: |
          cmake -S dependencies/xmrig -B build -DUV_LIBRARY="/usr/lib/$(gcc -dumpmachine)/libuv.so"
          cmake --build build -j"$(nproc)"
          strip build/xmrig
          mkdir dist
          cp build/xmrig dist/xmrig-linux-arm64

      # The installer refuses a host older than its RELEASE_MIN_GLIBC: a binary needing a newer
      # glibc fails the tag here, before anything is published.
      - name: Check the binary's glibc, libuv and version
        run: |
          min=$(sed -n 's/^RELEASE_MIN_GLIBC="\([0-9]*\.[0-9]*\)"$/\1/p' scripts/install.sh)
          need=$(objdump -T dist/xmrig-linux-arm64 | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)
          if [ -z "$min" ] || [ -z "$need" ] || [ "$(printf '%s\n' "$need" "$min" | sort -V | tail -n 1)" != "$min" ]; then
            echo "::error::The binary needs glibc ${need:-unknown}, and the installer's minimum is ${min:-unset}."
            exit 1
          fi
          ldd dist/xmrig-linux-arm64 | grep -E '^[[:space:]]libuv[.]so[.]1 => /'
          dist/xmrig-linux-arm64 --version

      - uses: actions/upload-artifact@v7
        with:
          name: release-binary
          path: dist/xmrig-linux-arm64
          if-no-files-found: error
          retention-days: 1

  # The DietPi first-boot zip: our dietpi.txt and the custom script, which installs only this tag's
  # installer, checked by its sha256. A job of its own, apart from the XMRig build, so no upstream
  # code runs where the boards' root script is made.
  release-bundle:
    name: Build DietPi first-boot zip
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      zip-sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          bash scripts/dietpi_bundle.sh "$TAG" dist

      # The publish job checks the zip it downloads against this sum, made where the zip was built.
      - name: Sum the zip
        id: zip
        run: |
          echo "sha256=$(sha256sum dist/dietpi-first-boot.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: dist/dietpi-first-boot.zip
          if-no-files-found: error
          retention-days: 1

  # Checks out nothing and runs nothing the repository holds: it sums, attests and publishes the
  # bytes the build job made, so the write and signing tokens never meet upstream code.
  release-publish:
    name: Publish release binary
    needs: [release-build, release-bundle]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-binary
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: dist

      # The XMRig build job's token can replace a run's artifact, so the zip must match the sum the
      # bundle job made before it is summed, attested and published.
      - name: Check the zip is the one the bundle job built
        working-directory: dist
        env:
          BUNDLE_SHA256: ${{ needs.release-bundle.outputs.zip-sha256 }}
        run: |
          [[ $BUNDLE_SHA256 =~ ^[0-9a-f]{64}$ ]]
          printf '%s  dietpi-first-boot.zip\n' "$BUNDLE_SHA256" | sha256sum -c -

      - name: Sum the binary and the zip
        working-directory: dist
        run: sha256sum xmrig-linux-arm64 dietpi-first-boot.zip > SHA256SUMS

      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/xmrig-linux-arm64
            dist/dietpi-first-boot.zip

      # gh release create fails when the release exists, so a published asset is never replaced. A
      # tag with a pre-release part (v0.2.0-rc.1) makes a pre-release.
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          XMRIG_COMMIT: ${{ needs.release-build.outputs.xmrig-commit }}
        run: |
          [[ $XMRIG_COMMIT =~ ^[0-9a-f]{40}$ ]]
          pre=()
          case $TAG in *-*) pre=(--prerelease) ;; esac
          {
            echo "xmrig-linux-arm64 is XMRig for Linux arm64, built unmodified by this repository's CI on Debian 13 from https://github.com/MoneroOcean/xmrig at commit $XMRIG_COMMIT, the commit this tag pins. XMRig is licensed under GPL-3.0; that commit is its source."
            echo
            echo "Check it from a PC: gh attestation verify xmrig-linux-arm64 --repo MorganKryze/Monero-miner-setup"
            echo "Check it on the board: sha256sum -c --ignore-missing SHA256SUMS"
            echo
            echo "dietpi-first-boot.zip holds dietpi.txt and Automation_Custom_Script.sh for a DietPi card, and DietPi's licence: the script installs this release only. Check it from a PC: gh attestation verify dietpi-first-boot.zip --repo MorganKryze/Monero-miner-setup"
            echo "Its dietpi.txt is DietPi v10.8's (GPL-2.0, https://github.com/MichaIng/DietPi) with the settings this project needs changed."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md "${pre[@]}" xmrig-linux-arm64 dietpi-first-boot.zip SHA256SUMS
