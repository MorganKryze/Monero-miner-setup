# Board profiles: one line per value, <profile>.<key>=<value>, no quotes.
# Read as data by the installer, doctor and the bench; never run.
#
# Profile names are 1 to 16 lower case letters and digits. Keys:
#   compatible  device tree compatible strings (/proc/device-tree/compatible), separated by spaces
#   max         CPUs for --mode max, in the kernel's cpulist form (0-3, 0,1,4-7)
#   eco         CPUs for --mode eco
#   layouts     CPU lists the bench tries, separated by spaces
#   eco-cap     cpufreq policy=maximum kHz caps for eco, separated by spaces
#   measured    device tree models (/proc/device-tree/model) whose run was measured, separated by ;
#
# A profile with a value that fails its check is ignored.

bcm2712.compatible=brcm,bcm2712
bcm2712.max=0-3
bcm2712.eco=0-3
bcm2712.layouts=0-3
bcm2712.eco-cap=policy0=1800000
bcm2712.measured=

rk3588.compatible=rockchip,rk3588 rockchip,rk3588s
rk3588.max=0-7
rk3588.eco=4-7
rk3588.layouts=0-7 4-7 0,1,4-7
rk3588.eco-cap=policy4=1800000 policy6=1800000
rk3588.measured=
