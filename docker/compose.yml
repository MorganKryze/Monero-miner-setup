services:
  xmrig:
    # Default: pull the multi-arch prebuilt image from GHCR.
    # Override XMRIG_IMAGE in .env to pin a tag (e.g. :v1.2.3, :main-abc1234)
    # or to point at a fork. `docker compose up --build` rebuilds locally
    # from the Dockerfile below and retags as XMRIG_IMAGE.
    image: ${XMRIG_IMAGE:-ghcr.io/morgankryze/monero-miner-setup:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: monero_xmrig_miner
    restart: unless-stopped
    
    environment:
      - WALLET_ADDRESS=${WALLET_ADDRESS}
      - WORKER_NAME=${WORKER_NAME:-docker_miner}
      - POOL_URL=${POOL_URL:-gulf.moneroocean.stream}
      - DONATE_LEVEL=${DONATE_LEVEL:-0}
      - MAX_THREADS_PERCENT=${MAX_THREADS_PERCENT:-75}
      - PAUSE_ON_BATTERY=${PAUSE_ON_BATTERY:-false}
      - PAUSE_ON_ACTIVE=${PAUSE_ON_ACTIVE:-false}
      - FORCE_THREAD_COUNT=${FORCE_THREAD_COUNT:-}
    
    # Resource caps. Top-level keys rather than deploy.resources.limits so
    # they apply under plain `docker compose up` without requiring Swarm mode.
    cpus: '${CPU_COUNT:-2.0}'
    # 3g holds RandomX's fast-mode dataset (2.30 GiB measured); under 2560 MiB the miner
    # switches to light mode itself, at a fraction of the hashrate.
    mem_limit: '${MEMORY_LIMIT:-3g}'


    # Mount logs for persistence
    volumes:
      - ./logs:/app/logs
      - ./docker-configs:/app/configs
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    
    # Health check override
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Container stdout/stderr rotation (the /app/logs/xmrig.log file inside
    # the container is separate; mount it read-only or truncate it externally
    # if disk growth is a concern).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"